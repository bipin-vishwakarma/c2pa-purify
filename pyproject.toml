[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c2pa-purify"
version = "1.0.0"
description = "Lossless sanitizer and forensics inspector for embedded C2PA provenance manifests and Anthropic Files/Claude claim markers."
readme = "README.md"
authors = [{ name = "Bipin Vishwakarma" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["c2pa", "anthropic", "claude", "metadata", "svg", "png", "jpeg", "webp", "sanitizer", "provenance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "rich>=12.0.0",
    "pillow>=9.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "cryptography>=38.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
c2pa-purify = "c2pa_purify.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["c2pa_purify*"]
